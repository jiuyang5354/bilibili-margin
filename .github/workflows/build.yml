name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pack:firefox
      - uses: actions/upload-artifact@v4
        with:
          name: margin
          path: dist/
      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME}"
          for f in CHANGELOG.md CHANGELOG.en.md; do
            awk -v t="[$tag](" '/^##/&&index($0,t){on=1;next} on&&(/^###? \[?v[0-9]/||/^## [^[v]/){exit} on' "$f"
            echo; echo '---'; echo
          done > release-notes.md
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            margin.zip
            margin-firefox.zip
          body_path: release-notes.md
      - name: Publish to Edge Add-ons
        id: edge
        if: startsWith(github.ref, 'refs/tags/v') && env.EDGE_API_KEY != ''
        run: node scripts/edge-publish.mjs margin.zip
      # 上一版仍在审核：打上 edge-pending 标记，edge-retry.yml 会定时补交最新 Release。
      # 提交成功：清掉旧标记。edge-pending 不匹配 v*，推送它不会触发构建。
      - name: Mark Edge submission pending
        if: steps.edge.outputs.status == 'pending'
        run: git tag -f edge-pending && git push -f origin refs/tags/edge-pending
      - name: Clear Edge pending mark
        if: steps.edge.outputs.status == 'submitted'
        run: git push origin :refs/tags/edge-pending || true
