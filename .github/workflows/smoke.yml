name: smoke
# 冒烟测试：构建扩展，在离线伪造的 B 站上打开各接管页面，断言无未捕获错误、关键元素存在，截图作为产物上传。
# 发布逻辑在 build.yml，这里只测试。
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit test (settings / filter / md5 / footprint)
        run: npm run test:unit
      - name: Heatmap migration, pagination and error recovery
        run: node --test tests/heatmap-reliability.cjs
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Display version and update comparison
        run: node tests/popup-version.mjs
        env:
          SMOKE_OUT: smoke-artifacts/popup-version
      - name: Favorites loading, drawer scrolling and inline dynamic comments
        run: |
          node tests/favorites-loading.mjs
          node tests/dynamic-inline-comments.mjs
          node tests/dynamic-inline-reply.mjs
          node tests/dynamic-composer-extension.mjs
      - name: Native Lit publish button and motion
        run: node tests/button-motion.mjs
      - name: Favorite actions, message recall and viewport edges
        run: |
          node tests/issues-20261110.mjs
          node tests/watch-edges.mjs
          node tests/favorite-transfer.mjs
          node tests/watch-native-overlays.mjs
      - name: Space drawer regressions
        run: npm run test:drawers
      - name: Space articles, audio and public favorites
        run: node tests/space-content.mjs
        env:
          SMOKE_OUT: smoke-artifacts/space-content
      - name: Private favorites, dynamic badges and manual live expansion
        run: node tests/issues-20261111.mjs
        env:
          SMOKE_OUT: smoke-artifacts/issues-20261111
      - name: Comment submission locks, dynamic search and live backgrounds
        run: node tests/issues-20261111-next.mjs
        env:
          SMOKE_OUT: smoke-artifacts/issues-20261111-next
      - name: Flat surface keeps the upload accent button readable
        run: node tests/issues-20261113.mjs
        env:
          SMOKE_OUT: smoke-artifacts/issues-20261113
      - name: Native charging-video filter, sorting and search
        run: node tests/space-charging.mjs
      - name: Application window navigation
        run: npm run test:app-window
      - name: Native comment locations and both search styles
        run: node tests/pr-completion.mjs
        env:
          SMOKE_OUT: smoke-artifacts/pr-completion
      - name: Recommendation batch navigation
        run: node tests/feed-batches.mjs
        env:
          SMOKE_OUT: smoke-artifacts/feed-batches
      - name: Native controls follow the selected accent
        run: node tests/accent-controls.mjs
        env:
          SMOKE_OUT: smoke-artifacts/accent-controls
      - name: Watch Later creator filters and groups
        run: npm run test:watch-later
        env:
          SMOKE_OUT: smoke-artifacts/watch-later-groups
      - name: Manual danmaku jump suggestions
        run: npm run test:danmaku-jump
        env:
          SMOKE_OUT: smoke-artifacts/danmaku-jump
      - name: Community advertisement skipping
        run: npm run test:sponsor-skip
      - name: Opt-in danmaku clicks and undo
        run: npm run test:danmaku-airborne
      - name: Background frame pacing
        run: npm run test:frame-budget
      - name: UI interaction performance
        run: npm run test:performance-ui
        env:
          SMOKE_OUT: smoke-artifacts/performance-ui
      - name: Independent control effects and flat surfaces
        run: node tests/effect-controls.mjs
        env:
          SMOKE_OUT: smoke-artifacts/effect-controls
      - name: Glass theme switch integration
        run: node tests/sun-moon.mjs
        env:
          SMOKE_OUT: smoke-artifacts/sun-moon
      - name: Private message images and emojis
        run: npm run test:message-media
        env:
          SMOKE_OUT: smoke-artifacts/message-media
      - name: Session loading and cached history
        run: npm run test:message-loading
        env:
          SMOKE_OUT: smoke-artifacts/message-loading
      - name: Cross-tab message unread synchronization
        run: node tests/message-sync.mjs
        env:
          SMOKE_OUT: smoke-artifacts/message-sync
      - name: Transparent header over high-contrast backgrounds
        run: npm run test:header-surface
        env:
          SMOKE_OUT: smoke-artifacts/header-surface
      - name: Smoke test (offline mocked bilibili)
        run: npm run test:smoke
        env:
          SMOKE_BUNDLED: '1'
          SMOKE_OUT: smoke-artifacts
      - name: Dashboard, settings, wide title and space collections regressions
        run: npm run test:reported-issues
        env:
          SMOKE_OUT: smoke-artifacts/reported-issues
      - name: Weather location, offline cities and cross-domain recovery
        run: |
          node tests/weather-system.mjs
          node tests/weather-offline.mjs
        env:
          SMOKE_OUT: smoke-artifacts/weather-system
      - name: Transparent dynamic glass and undistorted content
        run: node tests/dynamic-glass.mjs
        env:
          SMOKE_OUT: smoke-artifacts/dynamic-glass
      - name: Native channel theme and video navigation
        run: |
          SMOKE_OUT=smoke-artifacts/channel-theme node tests/channel-theme.mjs
          SMOKE_OUT=smoke-artifacts/channel-carousel node tests/channel-carousel.mjs
      - name: Dynamic nested replies and live leaderboard contrast
        run: |
          SMOKE_OUT=smoke-artifacts/dynamic-replies node tests/dynamic-replies.mjs
          SMOKE_OUT=smoke-artifacts/live-rank-theme node tests/live-rank-theme.mjs
          SMOKE_OUT=smoke-artifacts/live-home-theme node tests/live-home-theme.mjs
      - name: Native share button sizing
        run: npm run test:watch-share
        env:
          SMOKE_OUT: smoke-artifacts/watch-share
      - name: Native like costume positioning and comment loading colors
        run: node tests/native-watch-feedback.mjs
        env:
          SMOKE_OUT: smoke-artifacts/native-watch-feedback
      - name: Cover previews, dynamic attachments and native picture popups
        run: node tests/latest-feedback.mjs
        env:
          SMOKE_OUT: smoke-artifacts/latest-feedback
      - name: Cover preview timing and stale request cancellation
        run: node tests/preview-timing.mjs
        env:
          SMOKE_OUT: smoke-artifacts/preview-timing
      - name: Comment feedback, search drops and filter scanning
        run: node tests/comment-feedback.mjs
        env:
          SMOKE_OUT: smoke-artifacts/comment-feedback
      - name: Comment metadata and collapse positioning
        run: node tests/comment-layout.mjs
        env:
          SMOKE_OUT: smoke-artifacts/comment-layout
      - name: Opening animation and graphics fallback
        run: node tests/intro.mjs
        env:
          SMOKE_OUT: smoke-artifacts/intro
      - name: Dynamic livestream reservations
        run: node tests/dynamic-reserve.mjs
        env:
          SMOKE_OUT: smoke-artifacts/dynamic-reserve
      - name: Player loading corners and hydration-safe card startup
        run: |
          SMOKE_OUT=smoke-artifacts/watch-startup node tests/watch-startup.mjs
          SMOKE_OUT=smoke-artifacts/watch-card-startup node tests/watch-card-startup.mjs
          SMOKE_OUT=smoke-artifacts/watch-playlist node tests/watch-playlist.mjs
      - name: Reported theme, overlay, automatic mode and authorization regressions
        run: |
          SMOKE_OUT=smoke-artifacts/header-feedback node tests/header-feedback.mjs
          SMOKE_OUT=smoke-artifacts/watch-auto-mode node tests/watch-auto-mode.mjs
          SMOKE_OUT=smoke-artifacts/lightbox node tests/lightbox.mjs
          SMOKE_OUT=smoke-artifacts/app-auth-feedback node tests/app-auth-feedback.mjs
          SMOKE_OUT=smoke-artifacts/app-auth-remember node tests/app-auth-remember.mjs
          SMOKE_OUT=smoke-artifacts/settings-thumbnails node tests/settings-thumbnails.mjs
          SMOKE_OUT=smoke-artifacts/background-url node tests/background-url.mjs
      - name: Live fullscreen, automatic wide alignment, subscriptions and pointer release
        run: |
          SMOKE_OUT=smoke-artifacts/watch-screen node tests/watch-screen.mjs
          SMOKE_OUT=smoke-artifacts/watch-toolbar node tests/watch-toolbar.mjs
          SMOKE_OUT=smoke-artifacts/favorites-subscriptions node tests/favorites-subscriptions.mjs
          SMOKE_OUT=smoke-artifacts/triple-release node tests/triple-release.mjs
      - name: November messages, player, live and weather regressions
        run: node tests/november-feedback.mjs
        env:
          SMOKE_OUT: smoke-artifacts/november-feedback
      - name: Categorized settings navigation and retained preferences
        run: |
          node tests/settings-page.mjs
          node tests/navigation-layout.mjs
        env:
          SMOKE_OUT: smoke-artifacts/settings-page
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: smoke-artifacts/
          if-no-files-found: warn
  privacy-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run build
      - name: Rich message draft editing in Chromium and Firefox
        run: |
          node tests/message-editor.mjs
          node tests/firefox-message-extension.mjs
        env:
          SMOKE_OUT: privacy-performance/message-editor
      - name: Native recommendation username rendering
        run: node tests/watch-upnames.mjs
        env:
          SMOKE_OUT: privacy-performance/upnames
      - name: Settings export and dynamic follow-list preferences
        run: node tests/new-feedback.mjs
        env:
          SMOKE_OUT: privacy-performance/new-feedback
      - name: Loaded-extension heatmap migration and short visits
        run: node tests/heatmap-extension.mjs
        env:
          SMOKE_OUT: privacy-performance/heatmap
      - name: Animation layout and cleanup
        run: npm run test:animation-performance
        env:
          SMOKE_OUT: privacy-performance/animation
      - name: Incremental comment processing
        run: npm run test:comment-performance
        env:
          COMMENT_OUT: privacy-performance/comments.json
      - name: Profile card interactions
        run: npm run test:content-performance
        env:
          SMOKE_OUT: privacy-performance/profile
      - name: Extension privacy boundaries
        run: npm run test:privacy
        env:
          SMOKE_OUT: privacy-performance/privacy
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-performance-results
          path: privacy-performance/
          if-no-files-found: warn
