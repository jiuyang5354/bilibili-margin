<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>映间 MARGIN · 更新</title>
<style>
  :root{color-scheme:light dark;--bg:#f5f4f1;--card:#fff;--ink:#17181a;--muted:#6f7177;--line:rgb(23 24 26 / .1);--chip:rgb(23 24 26 / .05);--accent:#00aeec;--ok:#12a150;--warn:#d4610a;--rk:1}
  @media (prefers-color-scheme:dark){:root{--bg:#141415;--card:#1d1d1f;--ink:#ededee;--muted:#9a9ba0;--line:rgb(255 255 255 / .1);--chip:rgb(255 255 255 / .06)}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;padding:32px 24px;background:var(--bg);color:var(--ink);font:13px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  main{max-width:520px;margin:0 auto}
  h1{margin:0;font:600 22px/1.3 "Noto Serif SC","Songti SC",serif;letter-spacing:.04em}
  .sub{margin:4px 0 20px;font:10px/1 ui-monospace,Menlo,monospace;letter-spacing:.22em;color:var(--muted)}
  .card{padding:18px;border-radius:calc(14px * var(--rk));background:var(--card);border:1px solid var(--line)}
  .line{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
  .line:last-child{border-bottom:0}
  .line span{color:var(--muted)}
  .line b{font:600 13px/1 ui-monospace,Menlo,monospace}
  .status{margin:16px 0 0;padding:11px 13px;border-radius:calc(10px * var(--rk));background:var(--chip);white-space:pre-wrap;word-break:break-word}
  .status.ok{color:var(--ok)}
  .status.warn{color:var(--warn)}
  .acts{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}
  button{border:1px solid var(--line);border-radius:calc(9px * var(--rk));background:var(--card);color:var(--ink);font:inherit;padding:8px 15px;cursor:pointer;transition:background .18s,border-color .18s}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:default}
  button.primary{background:var(--accent);border-color:transparent;color:#fff;font-weight:600}
  a{color:var(--accent)}
  .note{margin:18px 0 0;color:var(--muted);font-size:11.5px;line-height:1.7}
  ol{margin:16px 0 0;padding-left:20px;color:var(--muted);font-size:12px}
  ol li{margin:5px 0}
  ol li.done{color:var(--ok)}
</style>
</head>
<body>
<main>
  <h1>检查更新</h1>
  <p class="sub">MARGIN · UPDATE</p>
  <div class="card">
    <div class="line"><span>当前版本</span><b id="cur">—</b></div>
    <div class="line"><span>最新正式版</span><b id="latest">—</b></div>
    <div class="line"><span>发布包</span><b id="pack">—</b></div>
    <p class="status" id="status" role="status" aria-live="polite">正在读取本机状态…</p>
    <div class="acts">
      <button id="check" type="button">检查更新</button>
      <button id="download" type="button" hidden>下载更新包</button>
      <button id="install" type="button" class="primary" hidden>选择目录并写入</button>
      <a id="release" target="_blank" rel="noopener" hidden>查看发布页</a>
    </div>
  </div>
  <ol>
    <li id="s1">检查版本</li>
    <li id="s2">下载更新包</li>
    <li id="s3">选择扩展安装目录并写入</li>
    <li id="s4">到扩展管理页点一次「重新加载」</li>
  </ol>
  <p class="note">扩展只能改写你自己授权的文件夹：第 3 步请选中当初「加载已解压的扩展程序」时用的那个目录。写入完成后需要你到浏览器扩展管理页点一次「重新加载」，之后打开的 B 站标签页刷新一下就会用上新版。商店安装的版本由浏览器自己更新，不需要这里。</p>
</main>
<script src="update.js"></script>
</body>
</html>
